<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Netflix Birthday</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="background-wrapper">
			<img
				src="https://assets.nflxext.com/ffe/siteui/vlv3/85e22987-d2dd-46ca-b8b7-65cd0e31c24a/629ae878-26a7-4d88-b12b-af5018a1f7b2/US-en-20201123-popsignuptwoweeks-perspective_alpha_website_large.jpg"
			/>
	</div>

  <div class="login-page">
    <header>
			<div class="logo">
				<img src="assets/logo.png" alt="" />
			</div>
		</header>

    <!-- Login form container -->
    <div class="login-container">
      <h1 class="login-heading">Sign In</h1>

      <!-- Error message (hidden by default) -->
      <div id="error-message" class="login-error hidden">
        Incorrect username or password. Please try again.
      </div>

      <!-- Login form -->
      <form id="login-form" class="login-form">
        <input 
          type="text" 
          id="username" 
          class="form-input" 
          placeholder="Email or username" 
          required
          autocomplete="username"
        >
        
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="Password" 
          required
          autocomplete="current-password"
        >
        
        <button type="submit" class="login-submit">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- Import config.js first (contains credentials) -->
  <script src="data/config.js"></script>
  
  <!-- Import login logic -->
  <script src="js/login.js"></script>
</body>
</html>
