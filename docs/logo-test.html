<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Logo Comparison</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px;
    }
    
    .comparison-container {
      display: flex;
      gap: 80px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .logo-section {
      text-align: center;
    }
    
    .logo-section h2 {
      color: #E50914;
      font-family: Arial, sans-serif;
      margin-bottom: 20px;
      font-size: 18px;
    }
    
    .logo-section p {
      color: #fff;
      font-family: Arial, sans-serif;
      margin-top: 20px;
      font-size: 14px;
      max-width: 250px;
    }
    
    .netflix-logo-static {
      position: relative;
      width: 200px;
      height: 280px;
      opacity: 1;
      transform: scale(1);
    }
    
    .success {
      color: #46d369;
    }
    
    .check {
      font-size: 48px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="comparison-container">
    <div class="logo-section">
      <h2>✅ FIXED Netflix "N"</h2>
      <div class="netflix-logo-static">
        <div class="netflix-n">
          <div class="n-left"></div>
          <div class="n-diagonal"></div>
          <div class="n-right"></div>
        </div>
      </div>
      <p class="success">
        ✓ Diagonal connects bars<br>
        ✓ Proper 29° angle<br>
        ✓ Reads as "N"<br>
        ✓ Authentic proportions
      </p>
    </div>
    
    <div class="logo-section">
      <h2>Animation Preview</h2>
      <div style="color: #E50914; font-size: 48px; margin: 20px 0;">▶</div>
      <p style="color: #fff;">
        Click below to see<br>the animated version
      </p>
      <a href="index.html" style="
        display: inline-block;
        margin-top: 20px;
        padding: 15px 30px;
        background: #E50914;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        font-weight: bold;
      ">View Splash Screen</a>
    </div>
  </div>
  
  <div style="
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #808080;
    font-family: Arial, sans-serif;
    font-size: 12px;
    text-align: center;
  ">
    The "N" should now read correctly as a connected Netflix logo
  </div>
</body>
</html>
