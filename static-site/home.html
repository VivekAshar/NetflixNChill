<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Birthday - Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="navbar-content">
      <div class="navbar-logo">
        <!-- NETFLIX -->
        <img src="assets/logo.png" alt="Netflix Logo">
      </div>
      <div class="navbar-menu" id="navbar-menu">
        <a href="#" class="navbar-link active">Home</a>
        <a href="#" class="navbar-link">Movies</a>
        <a href="#" class="navbar-link">TV Shows</a>
        <a href="#" class="navbar-link">My List</a>
        <button class="navbar-profile" id="profile-btn">
          <img src="assets/profiles/profile1.jpg" alt="Profile" class="navbar-profile-img" onerror="this.src='https://ui-avatars.com/api/?name=User&size=32&background=E50914&color=fff'">
        </button>
      </div>
      <!-- Mobile hamburger -->
      <button class="navbar-hamburger" id="hamburger-btn" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- Hero Banner -->
  <section class="hero" id="hero">
    <img src="" alt="Hero" class="hero-image" id="hero-image">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="hero-title">Loading...</h1>
      <p class="hero-subtitle" id="hero-subtitle"></p>
      <div class="hero-buttons">
        <button class="btn btn-primary btn-lg">
          <svg class="btn-icon" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Play
        </button>
        <button class="btn btn-secondary btn-lg">
          <svg class="btn-icon" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 8v8M12 16h.01"/></svg>
          More Info
        </button>
      </div>
    </div>
  </section>

  <!-- Content Rows Container -->
  <div id="content-rows" class="fade-in">
    <!-- Rows will be dynamically injected here by home.js -->
  </div>

  <!-- Video Modal -->
  <div class="modal-overlay" id="video-modal">
    <div class="modal">
      <button class="modal-close" id="modal-close-btn" aria-label="Close modal">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
      <div class="modal-video-container">
        <video 
          id="birthday-video" 
          class="modal-video"
          preload="metadata"
        >
          <source src="" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
  </div>

  <!-- Netflix-Style Custom Video Player Styles -->
  <style>
    /* Video Container */
    .modal-video-container {
      position: relative;
      cursor: pointer;
    }
    
    .modal-video {
      cursor: pointer;
    }
    
    /* Custom Controls Container */
    .netflix-video-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 10;
    }
    
    .netflix-video-controls.visible {
      opacity: 1;
      pointer-events: all;
    }
    
    /* Progress Bar Container */
    .netflix-progress-container {
      position: relative;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: height 0.2s ease;
    }
    
    .netflix-progress-container:hover {
      height: 8px;
    }
    
    .netflix-progress-bar {
      position: relative;
      width: 100%;
      height: 100%;
    }
    
    .netflix-progress-filled {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #E50914;
      width: 0%;
      transition: width 0.1s linear;
    }
    
    .netflix-progress-handle {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background: #E50914;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      left: 0%;
    }
    
    .netflix-progress-container:hover .netflix-progress-handle {
      opacity: 1;
    }
    
    /* Control Bar */
    .netflix-control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
      gap: 16px;
    }
    
    .netflix-controls-left,
    .netflix-controls-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    /* Buttons */
    .netflix-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, opacity 0.2s ease;
      position: relative;
    }
    
    .netflix-btn:hover {
      transform: scale(1.1);
    }
    
    .netflix-btn:active {
      transform: scale(0.95);
    }
    
    .netflix-btn svg {
      width: 24px;
      height: 24px;
    }
    
    .netflix-play-pause {
      position: relative;
      width: 32px;
      height: 32px;
    }
    
    .netflix-play-pause svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    .netflix-skip-forward {
      position: relative;
    }
    
    .skip-label {
      position: absolute;
      bottom: -2px;
      right: -2px;
      font-size: 10px;
      font-weight: bold;
      color: white;
      pointer-events: none;
    }
    
    /* Volume Control */
    .netflix-volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .netflix-volume-btn {
      position: relative;
      width: 32px;
      height: 32px;
    }
    
    .netflix-volume-btn svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    .netflix-volume-slider {
      width: 80px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    
    .netflix-volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
    }
    
    .netflix-volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }
    
    /* Time Display */
    .netflix-time-display {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      font-family: 'Roboto', sans-serif;
      white-space: nowrap;
    }
    
    .time-separator {
      color: rgba(255, 255, 255, 0.6);
    }
    
    /* Hidden utility */
    .hidden {
      display: none !important;
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      .netflix-volume-control {
        display: none;
      }
      
      .netflix-control-bar {
        padding: 8px 12px;
      }
      
      .netflix-controls-left {
        gap: 8px;
      }
      
      .netflix-btn svg {
        width: 20px;
        height: 20px;
      }
      
      .netflix-time-display {
        font-size: 12px;
      }
    }
  </style>

  <!-- Loading Indicator -->
  <div id="loading-indicator" class="loading-indicator">
    <div class="loading-spinner"></div>
    <p>Loading your birthday experience...</p>
  </div>

  <!-- Scripts -->
  <script src="data/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
