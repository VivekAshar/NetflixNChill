<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who's Watching? - Netflix Birthday</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="profile-page fade-in">
    <div class="profile-container">
      <h1 class="profile-heading">Who's watching?</h1>
      
      <!-- Profile grid - populated dynamically by profiles.js -->
      <div id="profile-grid" class="profile-grid">
        <!-- Profiles will be injected here by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Import config.js first (contains profile data) -->
  <script src="data/config.js"></script>
  
  <!-- Import profile logic -->
  <script src="js/profiles.js"></script>
</body>
</html>
