<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Birthday - Splash</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      overflow: hidden;
    }
    
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeOut 0.5s ease 2.5s forwards;
    }
    
    .netflix-logo-img {
      max-width: 400px;
      width: 40vw;
      height: auto;
      opacity: 0;
      animation: logoFadeIn 1s ease 0.2s forwards;
    }
    
    @keyframes logoFadeIn {
      to {
        opacity: 1;
      }
    }
    
    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
    
    @media (max-width: 768px) {
      .netflix-logo-img {
        width: 60vw;
      }
    }
  </style>
</head>
<body>
  <div class="splash-screen">
    <!-- Use the actual Netflix splash GIF -->
    <img 
      src="https://customer-assets.emergentagent.com/job_birthday-film-portal/artifacts/g40c58er_Splash.gif" 
      alt="Netflix" 
      class="netflix-logo-img"
    >
  </div>

  <!-- Optional TUDUM sound -->
  <audio id="tudum-sound" preload="auto">
    <source src="assets/tudum.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Play TUDUM sound
    const tudumSound = document.getElementById('tudum-sound');
    if (tudumSound) {
      tudumSound.play().catch(() => {
        console.log('TUDUM sound not available or autoplay blocked');
      });
    }

    // Redirect after 3 seconds
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 3000);
  </script>
</body>
</html>
